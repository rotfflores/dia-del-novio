    <div class="page-shell">
      <header class="site-header">
        <div class="wordmark" aria-label="Tú más yo">

        <div class="occasion"><span class="occasion-line" aria-hidden="true"></span><span data-text="occasion">Día del Novio</span></div>
      </header>

      <main id="main-content">
        <section id="welcome" class="welcome" aria-labelledby="welcome-title">
          <div class="photo-scene entrance" style="--delay: 60ms">
            <span class="photo-orbit orbit-one" aria-hidden="true"><svg><use href="#sparkle" /></svg></span>
            <span class="photo-orbit orbit-two" aria-hidden="true"><svg><use href="#sparkle" /></svg></span>
            <span class="photo-orbit orbit-three" aria-hidden="true">+</span>
            <div class="photo-backing" aria-hidden="true"></div>
            <figure class="photo-card">
              <div class="photo-window">
                <div id="photo-placeholder" class="photo-placeholder">
                  <div class="placeholder-border" aria-hidden="true"></div>
                  <div class="placeholder-emblem" aria-hidden="true"><svg><use href="#heart-outline" /></svg><span>+</span></div>
                  <p data-text="placeholderTitle">Nuestra foto favorita</p>
                  <span data-text="placeholderMessage">Este espacio es para nosotros.</span>
                  <span class="placeholder-coordinate" data-text="placeholderMemory" aria-hidden="true">TÚ & YO · RECUERDO 001</span>
                </div>
                <img id="couple-photo" class="couple-photo" alt="Nuestra foto favorita juntos" hidden decoding="async" fetchpriority="high" />
              </div>
              <figcaption>
                <span data-text="photoCaption">Mi lugar favorito siempre será contigo.</span>
                <svg aria-hidden="true"><use href="#heart-outline" /></svg>
              </figcaption>
            </figure>
            <span class="photo-tag" aria-hidden="true"><svg><use href="#pixel-heart" /></svg><span data-text="photoTag">MI PERSONA FAVORITA</span></span>
          </div>

          <div class="welcome-copy">
            <div class="couple-intro entrance" style="--delay: 240ms">
              <p class="eyebrow" data-text="eyebrow">Una historia, dos protagonistas</p>
              <p class="couple-names"><span id="her-name">[Nombre de ella]</span><span class="names-plus" aria-label="más">+</span><span id="his-name">[Nombre de él]</span></p>
            </div>
            <h1 id="welcome-title" class="entrance" style="--delay: 400ms" tabindex="-1">Nuestra aventura <em>comienza aquí</em></h1>
            <p class="welcome-message entrance" data-text="message" style="--delay: 550ms">Preparé algo especial para celebrar este día contigo. ¿Estás listo?</p>
            <div class="start-area entrance" style="--delay: 690ms">
              <div class="button-wrap">
                <button type="button" id="start-button" class="primary-button"><span data-text="button">Comenzar nuestra aventura ❤️</span><svg class="button-arrow" aria-hidden="true" focusable="false"><use href="#arrow-up-right" /></svg></button>
                <div id="heart-particles" class="heart-particles" aria-hidden="true"></div>
              </div>
              <p class="start-note"><svg aria-hidden="true"><use href="#sparkle" /></svg><span data-text="startNote">El primer capítulo de algo bonito</span></p>
            </div>
          </div>
        </section>

        <section id="next-part" class="memory-part" aria-labelledby="next-title" hidden></section>
        <section id="part-three" class="gallery-part" aria-labelledby="part-three-title" hidden></section>
